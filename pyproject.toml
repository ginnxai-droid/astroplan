[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astroplan-backend"
version = "3.6.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pyswisseph>=2.10.3",
  "timezonefinder>=6.5",
  "tzdata>=2024.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "cryptography>=42.0",
  "anthropic>=0.40",
  "firebase-admin>=6.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["tests/", "alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
  "s00: bootstrap, legal gate, validator",
  "s01: guardrail library and scanner",
  "s02: time and geocoding",
  "s03: constants, zodiac, ephemeris",
  "s04: chart engine",
  "s05: reference suite harness",
  "s06: vimshottari dasha",
  "s07: transits and sade sati",
  "s08: panchang",
  "s09: rule schema and loader",
  "s10: explanation layer and i18n",
  "s11: readings, daily insight, yogas, festivals",
  "s12: ashtakoota matching",
  "s13: annual forecast",
  "s14: prediction ledger",
  "s15: persistence, age gate, and privacy",
  "s16: optional llm rephrase",
  "s17: api, glossary, trust, telemetry, and contract",
  "s18: mobile shell",
  "s19: mobile notifications and offline",
  "s20: web-share freeze and release hardening",
  "release_gate_g1: needs human reference charts",
  "release_gate_g2: needs advisor sign-off",
]
