name: w-backend
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astro
          POSTGRES_PASSWORD: astro_ci
          POSTGRES_DB: astroplan
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U astro -d astroplan" --health-interval 5s --health-retries 10
    env:
      ASTRO_ENV: test
      ASTRO_DATABASE_URL: postgresql+psycopg://astro:astro_ci@localhost:5432/astroplan
    steps:
      - run: echo backend-ok
